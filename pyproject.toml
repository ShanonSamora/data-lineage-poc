[project]
name = "data-lineage-poc"
version = "0.1.0"
description = "Static Data Lineage with AI: Automatic and Continuous Column-Level Lineage Reconstruction via Source Code Analysis"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlglot>=25.0.0",
    "openai>=1.30.0",
    "gitpython>=3.1.43",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "jinja2>=3.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"
