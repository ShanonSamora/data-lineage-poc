name: Data Lineage Impact Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      # Three sibling source-repo directories (POC simulates the multi-repo case).
      - 'sample_repo_sql/**'
      - 'sample_repo_python/**'
      - 'sample_repo_adf/**'
      # Also re-run when the lineage code itself changes.
      - 'src/**'
      - 'main.py'
      - '.github/workflows/lineage-check.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  lineage-check:
    name: Lineage Impact Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history needed for diff

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -e .

      - name: Run lineage impact analysis
        id: lineage
        continue-on-error: true  # never block the PR; surface a degraded report instead
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # The analyzer materialises the base SHA in a temporary `git worktree`
          # (handled by src/pr_analyzer.py), so each of the three source repos is
          # scanned at both base and head. This is what makes cross-source-repo
          # impact detection work — a Python-only PR can flag SQL or ADF impact.
          python main.py \
            --pr-check \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --repo sample_repo_sql \
            --repo sample_repo_python \
            --repo sample_repo_adf \
            --output-file lineage-report.md

          # Store report for the comment step.
          #   * The delimiter is a random token (not 'EOF') so it can't collide with
          #     an 'EOF' line inside a SQL/stored-procedure transformation string.
          #   * The explicit `echo ""` guarantees the report ends with a newline, so
          #     the closing delimiter is always on its own line. Without it, a report
          #     with no trailing newline merges into the delimiter line and GitHub
          #     Actions fails with "Matching delimiter not found".
          {
            echo 'REPORT<<LINEAGE_REPORT_EOF_d83a17'
            cat lineage-report.md
            echo ""
            echo 'LINEAGE_REPORT_EOF_d83a17'
          } >> "$GITHUB_OUTPUT"

      - name: Build degraded report if analysis failed
        if: steps.lineage.outcome == 'failure'
        run: |
          cat > lineage-report.md <<'EOF'
          ## Data Lineage Impact Report

          ⚠️ **Analysis failed** — could not generate the lineage diff for this PR.

          This is usually transient: an OpenAI API timeout, a malformed SQL file, or a parser exception. Re-run the workflow or contact the maintainer if it persists.

          The deterministic SQL and ADF lineage analysis does **not** require the LLM, so the failure typically points to a Python file or stored procedure that hit the LLM fallback.
          EOF
          {
            echo 'REPORT<<LINEAGE_REPORT_EOF_d83a17'
            cat lineage-report.md
            echo ""
            echo 'LINEAGE_REPORT_EOF_d83a17'
          } >> "$GITHUB_OUTPUT"

      - name: Find existing comment
        uses: peter-evans/find-comment@v3
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: 'Data Lineage Impact Report'

      - name: Post or update PR comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: ${{ steps.lineage.outputs.REPORT }}
          edit-mode: replace
